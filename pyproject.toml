[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vtt"
version = "1.0.0"
description = "Build pipeline of the Vehicle_Power_Type_Trajectory_Dataset (VTT): trajectory + CAN-signal sequences for vehicle size and powertrain classification"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=2.0", "pandas>=2.2", "pyarrow>=17", "pyyaml>=6", "huggingface-hub>=0.25"]

[tool.setuptools.packages.find]
include = ["vtt*", "starter_kit*"]
